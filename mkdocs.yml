site_name: Collectary
site_description: User and developer documentation for Collectary — a cross-platform collection manager.
docs_dir: docs-src
site_dir: docs

repo_url: https://github.com/jaak0b/Collectary
repo_name: jaak0b/Collectary

extra_css:
  - assets/extra.css

theme:
  name: material
  font: false
  icon:
    logo: material/bookshelf
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Live Demo: demo.md
  - User Guide:
      - user-guide/getting-started.md
      - user-guide/android.md
      - user-guide/accounts.md
      - user-guide/collections.md
      - user-guide/items.md
      - user-guide/field-types.md
      - user-guide/sharing.md
      - user-guide/sync.md
      - user-guide/backup.md
      - user-guide/settings.md
  - Developer Guide:
      - dev-guide/architecture.md
      - dev-guide/building.md
      - dev-guide/dependency-injection.md
      - dev-guide/localization.md
      - dev-guide/adding-a-field-type.md
      - dev-guide/sync-architecture.md
      - dev-guide/testing.md
      - dev-guide/contributing.md
