name: Build & publish documentation

# Docs publish only after `quality` is green. Pages deploys from master -> /docs.
# Loop guard: the bot commit touches only docs/**, which paths-ignore excludes,
# and carries [skip ci], so it does not re-trigger this workflow.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Install Android + WASM workloads
        run: dotnet workload install android wasm-tools

      - name: Build & run full test suite
        run: pwsh ./build.ps1 --target Test --configuration Release

  build-docs:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install -r requirements.txt

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish WASM app
        run: dotnet publish src/Collectary.UI.Browser/Collectary.UI.Browser.csproj -c Release -o ./browser-publish

      - name: Build MkDocs site
        run: mkdocs build

      - name: Copy WASM app into docs/app/
        run: |
          mkdir -p docs/app
          cp -r ./browser-publish/wwwroot/. docs/app/

      # GitHub Pages runs Jekyll, which strips underscore-prefixed paths like the
      # WASM runtime's _framework/ dir. .nojekyll disables that for the whole site.
      - name: Disable Jekyll processing
        run: touch docs/.nojekyll

      - name: Commit generated docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add --force docs
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
          else
            git commit -m "docs: rebuild site and WASM app [skip ci]"
            git push
          fi
