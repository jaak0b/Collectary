name: Build & publish documentation

# Builds the MkDocs site (with the WASM demo app embedded under /app) and publishes it
# with GitHub's native Pages deployment — nothing is committed back to the repository.
# Requires Settings -> Pages -> Source = "GitHub Actions". Docs deploy only after the
# quality job (full test suite) is green.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Allow one concurrent Pages deployment; let an in-progress run finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nerdbank.GitVersioning needs full history to compute the version

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Install Android + WASM workloads
        run: dotnet workload install android wasm-tools

      - name: Build & run full test suite
        run: pwsh ./build.ps1 --target Test --configuration Release

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nerdbank.GitVersioning needs full history to compute the version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install -r requirements.txt

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish WASM app
        run: dotnet publish src/Collectary.UI.Browser/Collectary.UI.Browser.csproj -c Release -o ./browser-publish -p:WikiDemo=true

      - name: Build MkDocs site
        run: mkdocs build

      - name: Copy WASM app into site/app/
        run: |
          mkdir -p site/app
          cp -r ./browser-publish/wwwroot/. site/app/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
