name: Release

# Manual release: publishes a GitHub release with the Windows installer + update feed,
# the Android APK, and notes built from the commit messages since the previous release tag.
# Run it from the Actions tab after bumping the major/minor version in version.json.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COLLECTARY_ONEDRIVE_CLIENT_ID: ${{ secrets.COLLECTARY_ONEDRIVE_CLIENT_ID }}
  COLLECTARY_ANDROID_SIGNATURE_HASH: ${{ secrets.COLLECTARY_ANDROID_SIGNATURE_HASH }}
  COLLECTARY_ANDROID_KEYSTORE_BASE64: ${{ secrets.COLLECTARY_ANDROID_KEYSTORE_BASE64 }}
  COLLECTARY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.COLLECTARY_ANDROID_KEYSTORE_PASSWORD }}
  COLLECTARY_GOOGLE_CLIENT_ID: ${{ secrets.COLLECTARY_GOOGLE_CLIENT_ID }}
  COLLECTARY_GOOGLE_CLIENT_SECRET: ${{ secrets.COLLECTARY_GOOGLE_CLIENT_SECRET }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nerdbank.GitVersioning needs full history to compute the version

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build installer + APK and publish the release
        run: pwsh ./build.ps1 --target Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
